name: Import coloring assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-coloring-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download coloring images into this repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pictures
          BASE="https://star-color-akmbmw0zl-henryle1.vercel.app"
          for n in 01 02 03 04 05 06 07 08 09 10; do
            curl --fail --location --retry 3 "$BASE/pictures/winter-$n.png" --output "pictures/winter-$n.png"
          done
          curl --fail --location --retry 3 "$BASE/icon-192.png" --output icon-192.png
          curl --fail --location --retry 3 "$BASE/icon-512.png" --output icon-512.png

      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pictures icon-192.png icon-512.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import coloring image assets"
          git push
