name: Install exact plush cat pages
on:
  push:
    paths:
      - '.github/workflows/install-exact-cats.yml'
      - 'assets/exact10svg.tar.gz'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install exact traced pages
        run: |
          mkdir -p pictures
          tar -xzf assets/exact10svg.tar.gz -C pictures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pictures
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install exact regenerated plush cat pages"
          git push origin main
